[package]
name = "rig-vertexai"
version.workspace = true
edition.workspace = true
license = "MIT"
readme = "README.md"
description = "VertexAI model provider for Rig integration."

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
google-cloud-aiplatform-v1 = { workspace = true, optional = true }
google-cloud-auth = { workspace = true }
google-cloud-gax = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
rig-core = { path = "../rig-core", version = "0.42.0", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[features]
default = ["gemini"]
# The Gemini client, backed by the generated aiplatform crate; the Claude
# (`anthropic`) client needs only google-cloud-auth and reqwest
gemini = ["dep:google-cloud-aiplatform-v1"]

[dev-dependencies]
anyhow = { workspace = true }
rig-agent.workspace = true
schemars = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "completion_vertexai"
required-features = ["gemini"]

[[example]]
name = "tool_vertexai"
required-features = ["gemini"]

[[example]]
name = "no_rig_vertexai"
required-features = ["gemini"]
